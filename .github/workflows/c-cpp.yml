name: C/C++ CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

env:
  ACEDB_MACHINE: LINUX_4_OPT

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: make libs
      run: make libs
    - name: make sra
      run: make -C wsra
    - name: make magic2
      run: make -C wsa
    
