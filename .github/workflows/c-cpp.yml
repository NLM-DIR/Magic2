name: C/C++ CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

env:
  ACEDB_MACHINE: LINUX_4_OPT

jobs:
  build:

    runs-on: ubuntu-20.4

    steps:
    - uses: actions/checkout@v4
    - name: Install build dependencies
      run: |
          sudo apt-get update
          sudo apt-get inatall -y gcc-8 g++-8
          sudo apt-get install -y libbz2-dev liblzma-dev zlib1g-dev
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-8 80 --slave /usr/bin/g++ g++ /usr/bin/g++-8 --slave /usr/bin/gcov gcov /usr/bin/gcov-8
          gcc --version

    - name: make libs
      run: make libs
    - name: make sra
      run: make -C wsra
    - name: make magic2
      run: make -C wsa
    
