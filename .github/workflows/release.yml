name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            machine: LINUX_4_OPT
          - name: linux-arm64
            os: ubuntu-24.04-arm
            machine: LINUX_4_OPT
          - name: macos-x86_64
            os: macos-15-intel
            machine: MAC_X_64_OPT
          - name: macos-arm64
            os: macos-latest
            machine: MAC_X_64_OPT
    env:
      ACEDB_MACHINE: ${{ matrix.machine }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential zlib1g-dev libbz2-dev liblzma-dev libxmu-dev

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install xz bzip2 zlib || true

      - name: Build libraries
        run: make libs

      - name: Build magic2
        run: make -C wsa

      - name: Package binary
        run: |
          VERSION="${GITHUB_REF_NAME}"
          NAME="magic2-${VERSION}-${{ matrix.name }}"
          mkdir -p "dist/${NAME}/bin"
          cp -L "bin.${ACEDB_MACHINE}/magic2" "dist/${NAME}/bin/magic2"
          cp -L "bin.${ACEDB_MACHINE}/sortalign" "dist/${NAME}/bin/sortalign" || true
          chmod +x "dist/${NAME}/bin/"*
          "dist/${NAME}/bin/magic2" --version || true
          tar -C dist -czf "${NAME}.tar.gz" "${NAME}"

      - uses: actions/upload-artifact@v4
        with:
          name: magic2-${{ matrix.name }}
          path: magic2-*.tar.gz
          if-no-files-found: error

  check-builds:
    name: Check build status
    needs: build
    runs-on: ubuntu-latest
    if: always()
    outputs:
      build-success: ${{ steps.check.outputs.build-success }}
    steps:
      - name: Check if all builds succeeded
        id: check
        run: |
          if [ "${{ needs.build.result }}" = "success" ]; then
            echo "build-success=true" >> $GITHUB_OUTPUT
            echo "✅ All builds completed successfully"
          else
            echo "build-success=false" >> $GITHUB_OUTPUT
            echo "❌ One or more builds failed"
            exit 1
          fi

  release:
    name: Create release
    needs: [build, check-builds]
    runs-on: ubuntu-latest
    if: needs.check-builds.outputs.build-success == 'true'
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: magic2-*
          merge-multiple: true

      - name: Create release and upload binaries
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.tar.gz
          generate_release_notes: true

  report-failure:
    name: Report build failures
    needs: [build, check-builds]
    runs-on: ubuntu-latest
    if: needs.check-builds.outputs.build-success == 'false'
    permissions:
      contents: read
    steps:
      - name: Summarize failures
        run: |
          echo "## ❌ Build Workflow Failed"
          echo ""
          echo "One or more platform builds failed. Review the build logs to identify and fix the issue."
          echo ""
          echo "Failed build matrix configurations:"
          echo "- Check the 'Build' job logs above for details"
          exit 1
